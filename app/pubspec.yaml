name: supreme_council
description: "Supreme Council: multi-agent debate where role-based AIs argue, a chair rules, and dissent stays visible."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # IBM Plex, SIL Open Font License 1.1 (assets/fonts/OFL.txt).
  fonts:
    - family: Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: Plex Serif
      fonts:
        - asset: assets/fonts/IBMPlexSerif-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSerif-Regular.ttf
    - family: Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
